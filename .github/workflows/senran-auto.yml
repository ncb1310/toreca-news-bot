name: Senran illustrated greetings
on:
  workflow_dispatch:
  schedule:
    - cron: '19,49 23,0-13 * * *'
  push:
    paths:
      - senran_bot.py
      - .github/workflows/senran-auto.yml
      - tests/test_senran.py
permissions:
  contents: write
concurrency:
  group: toreca-news-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image validation dependency
        run: python -m pip install 'Pillow==13.0.0'
      - name: Check publication safeguards
        run: python -m unittest discover -s tests -p test_senran.py -v
      - name: Configure durable publication records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish current Senran greeting with matching approved image
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python senran_bot.py
