name: Image publication verification
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/image-publication-test.yml
permissions:
  contents: write
concurrency:
  group: toreca-news-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Configure durable state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish image once and read result
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python post_image_once.py
