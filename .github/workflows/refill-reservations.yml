name: Refill image post reservations
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - refill_queue.py
      - tests/test_refill.py
      - .github/workflows/refill-reservations.yml
permissions:
  contents: write
concurrency:
  group: toreca-news-production
  cancel-in-progress: false
jobs:
  refill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
   python -m pip install 'Pillow==13.0.0'
   sudo apt-get update -qq
   sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest discover -s tests -p test_refill.py -v
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Maintain future image-backed reservations
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python refill_queue.py
