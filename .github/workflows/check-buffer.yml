name: Buffer connection check

on:
  workflow_dispatch:
  push:
    paths:
      - check_buffer.py
      - tests/test_connection.py
      - .github/workflows/check-buffer.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test error handling and secret protection
        run: python -m unittest discover -s tests -v
      - name: Read-only Buffer connection check
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python check_buffer.py
